<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>수업 목록 — 수업기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<header class="site-header" id="siteHeader"></header>

<main>
  <div class="list-header wrap">
    <h1>수업 목록</h1>
    <p>학년, 과목, 학기로 좁히거나 단원명·차시 제목·성취기준 코드로 찾아보세요.</p>
  </div>

  <div class="filter-bar wrap">
    <select id="filterGrade"></select>
    <select id="filterSubject"></select>
    <select id="filterSemester">
      <option value="">학기 전체</option>
      <option value="1">1학기</option>
      <option value="2">2학기</option>
    </select>
    <input type="search" id="filterSearch" placeholder="단원명, 차시 제목, 성취기준 코드로 검색" />
    <button class="filter-reset" id="filterReset">필터 초기화</button>
  </div>

  <div class="wrap list-body">
    <p class="list-count" id="listCount"></p>
    <div class="card-grid" id="listGrid"></div>
  </div>
</main>

<footer class="site-footer" id="siteFooter"></footer>

<script type="module" src="assets/js/list.js"></script>
</body>
</html>

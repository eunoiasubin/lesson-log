<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Firestore 시드 — 개발용</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #20302a; }
  button { font-size: 1rem; padding: 10px 18px; cursor: pointer; }
  #log { white-space: pre-wrap; margin-top: 20px; font-family: monospace; font-size: 0.85rem; background: #f3f3ee; padding: 12px; border-radius: 4px; min-height: 100px; }
</style>
</head>
<body>
<h1>Firestore 예시 데이터 넣기</h1>
<p>1단계에서 쓰던 예시 데이터(단원 4개, 차시 4개)를 Firestore의 <code>units</code>, <code>lessons</code> 컬렉션에 넣습니다. 개발용 페이지이며 실제 사이트 내비게이션에는 연결되어 있지 않습니다.</p>
<button id="seedBtn">시드 데이터 넣기</button>
<div id="log">대기 중...</div>

<script type="module">
  import { db } from "../assets/js/firebase-init.js";
  import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import { UNITS, LESSONS } from "./seed-data.js";

  const log = document.getElementById("log");
  function write(msg) {
    log.textContent += "\n" + msg;
  }

  document.getElementById("seedBtn").addEventListener("click", async () => {
    log.textContent = "시작합니다...";
    try {
      for (const unit of UNITS) {
        const { id, ...data } = unit;
        await setDoc(doc(db, "units", id), data);
        write(`unit 저장됨: ${id} (${data.name})`);
      }
      for (const lesson of LESSONS) {
        const { id, ...data } = lesson;
        await setDoc(doc(db, "lessons", id), data);
        write(`lesson 저장됨: ${id} (${data.title})`);
      }
      write("\n완료. 사이트 페이지를 새로고침해 확인하세요.");
    } catch (err) {
      write("오류: " + err.message);
      console.error(err);
    }
  });
</script>
</body>
</html>
